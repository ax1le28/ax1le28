  <text x="60" y="414" fill="#C2CAE1" font-family="Arial, Helvetica, sans-serif" font-size="24">Object detection → spoken guidance</text>
  <text x="60" y="458" fill="#8992B1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">PROJECT ILLUSTRATION</text>
