    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF766B"/><stop offset=".52" stop-color="#B589FF"/><stop offset="1" stop-color="#5EA7FF"/></linearGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="490" fill="url(#bg)"/>
  <rect width="1200" height="490" fill="url(#dots)"/>
