<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Assistive Vision Glasses illustration</title>
  <desc id="desc">A graphic illustration of smart glasses with object detection markers and audio guidance.</desc>
  <defs>
