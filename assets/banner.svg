<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Javidan Bandaliyev</title>
  <desc id="d">Javidan Bandaliyev, CS student at ELTE Budapest building software for embedded systems, automation and AI. Illustration: a coffee cup whose steam is drawn as circuit-board traces.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8733F"/>
      <stop offset=".5" stop-color="#E3A15E"/>
      <stop offset="1" stop-color="#F1DEC0"/>
    </linearGradient>
    <linearGradient id="java" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D08A54"/>
      <stop offset="1" stop-color="#F0C48C"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1A17"/>
      <stop offset="1" stop-color="#14110F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E3A15E" stop-opacity=".16"/>
      <stop offset="1" stop-color="#E3A15E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F1DEC0" opacity=".06"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .cursor{animation:cur 1.1s steps(1) infinite}
      @keyframes cur{50%{opacity:0}}
      .trace{fill:none;stroke:#4A3A2E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .pulse{fill:none;stroke:#F0C48C;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 400;stroke-dashoffset:22;animation:up 2.8s ease-in infinite}
      .p2{animation-delay:.9s}
      .p3{animation-delay:1.8s}
      @keyframes up{0%{stroke-dashoffset:22;opacity:0}10%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-260;opacity:0}}
      .pad{animation:pad 2.8s ease-in-out infinite}
      .d2{animation-delay:.9s}
      .d3{animation-delay:1.8s}
      @keyframes pad{0%,70%{fill:#2A221C}85%{fill:#F0C48C}100%{fill:#2A221C}}
      .ripple{animation:rip 4s ease-in-out infinite;transform-origin:946px 214px;transform-box:view-box}
      @keyframes rip{50%{transform:scaleX(.92)}}
    </style>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#0D1117"/>
  <rect width="1200" height="380" rx="20" fill="url(#dots)"/>
  <circle cx="946" cy="200" r="240" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- identity -->
  <text x="64" y="104" class="mono" font-size="17" fill="#E3A15E" letter-spacing="1">~/java<tspan fill="#6E7681"> $ </tspan><tspan fill="#9DA7B3">software × hardware</tspan><tspan class="cursor" fill="#E3A15E">▍</tspan></text>

  <text x="60" y="186" class="sans" font-size="76" font-weight="800" letter-spacing="-2.5"><tspan fill="url(#java)">Jav</tspan><tspan fill="#F0F6FC">id</tspan><tspan fill="#F0C48C">a</tspan><tspan fill="#F0F6FC">n</tspan></text>
  <text x="60" y="262" class="sans" font-size="76" font-weight="800" fill="#F0F6FC" letter-spacing="-2.5">Bandaliyev</text>

  <text x="64" y="304" class="sans" font-size="20" fill="#9DA7B3">CS student @ ELTE  ·  embedded  ·  automation  ·  AI</text>

  <g transform="translate(64 326)">
    <rect width="168" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="18" y="22" class="mono" font-size="14" fill="#C9B8A3">⌖ Budapest, HU</text>
  </g>
  <g transform="translate(244 326)">
    <rect width="190" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="18" y="22" class="mono" font-size="14" fill="#C9B8A3">AZ · RU · EN · TR</text>
  </g>

  <!-- steam as circuit traces -->
  <path class="trace" d="M906 206 V170 L886 150 V104"/>
  <path class="trace" d="M946 206 V92"/>
  <path class="trace" d="M986 206 V160 L1010 136 V112"/>
  <path class="pulse" d="M906 206 V170 L886 150 V104"/>
  <path class="pulse p2" d="M946 206 V92"/>
  <path class="pulse p3" d="M986 206 V160 L1010 136 V112"/>
  <circle cx="886" cy="98" r="7" fill="#2A221C" stroke="#7A5B43" stroke-width="2.5" class="pad"/>
  <circle cx="946" cy="86" r="7" fill="#2A221C" stroke="#7A5B43" stroke-width="2.5" class="pad d2"/>
  <circle cx="1010" cy="106" r="7" fill="#2A221C" stroke="#7A5B43" stroke-width="2.5" class="pad d3"/>
  <circle cx="906" cy="170" r="3" fill="#7A5B43"/>
  <circle cx="986" cy="160" r="3" fill="#7A5B43"/>

  <!-- cup -->
  <path d="M1040 236 h16 a30 30 0 0 1 0 60 h-26" fill="none" stroke="#E9D9C2" stroke-width="9" stroke-linecap="round"/>
  <path d="M858 212 H1034 L1022 312 Q1019 330 1000 330 H892 Q873 330 870 312 Z" fill="url(#cup)" stroke="#E9D9C2" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="946" cy="214" rx="84" ry="10" fill="#3B2618" class="ripple"/>
  <ellipse cx="946" cy="214" rx="84" ry="10" fill="none" stroke="#E3A15E" stroke-opacity=".55" stroke-width="2"/>
  <text x="946" y="282" class="mono" font-size="22" font-weight="700" fill="#E3A15E" text-anchor="middle" letter-spacing="2">&lt;/&gt;</text>
  <!-- saucer -->
  <path d="M836 340 H1056" stroke="#E9D9C2" stroke-width="5" stroke-linecap="round"/>
  <path d="M866 350 H1026" stroke="#4A3A2E" stroke-width="4" stroke-linecap="round"/>
</svg>
