<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Javidan Bandaliyev</title>
<desc id="d">CS student at ELTE Budapest building software for embedded systems and automation. Open to internships.</desc>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FF766B"/>
<stop offset=".5" stop-color="#B589FF"/>
<stop offset="1" stop-color="#71A9FF"/>
</linearGradient>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FF8F86"/>
<stop offset=".55" stop-color="#C3A0FF"/>
<stop offset="1" stop-color="#8CB9FF"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#B589FF" stop-opacity=".22"/>
<stop offset="1" stop-color="#B589FF" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="1" fill="#E6EDF3" opacity=".07"/>
</pattern>
<clipPath id="view"><rect x="760" y="70" width="372" height="236" rx="18"/></clipPath>
<style>
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
.scan{animation:scan 3.6s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(226px);opacity:0}}
.box{stroke-dasharray:8 6;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-28}}
.tag{animation:blink 3.6s ease-in-out infinite}
@keyframes blink{0%,30%{opacity:0}40%,92%{opacity:1}100%{opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.r1{animation:bar 3.6s ease-in-out infinite}
.r2{animation:bar 3.6s ease-in-out infinite .4s}
.r3{animation:bar 3.6s ease-in-out infinite .8s}
@keyframes bar{0%,100%{opacity:.35}50%{opacity:1}}
.packet{animation:flow 2.4s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(64px);opacity:0}}
.cursor{animation:cur 1.1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
</style>
</defs>
<rect width="1200" height="380" rx="20" fill="#0D1117"/>
<rect width="1200" height="380" rx="20" fill="url(#dots)"/>
<circle cx="946" cy="188" r="260" fill="url(#glow)"/>
<rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
<!-- left: identity -->
<text x="64" y="96" class="mono" font-size="17" fill="#FF8F86" letter-spacing="1">~/javidan<tspan fill="#6E7681"> $ </tspan><tspan fill="#8B949E">software × hardware</tspan><tspan class="cursor" fill="#FF8F86">▍</tspan></text>
<text x="60" y="176" class="sans" font-size="74" font-weight="800" fill="#F0F6FC" letter-spacing="-2.5">Javidan</text>
<text x="60" y="250" class="sans" font-size="74" font-weight="800" fill="url(#nameGrad)" letter-spacing="-2.5">Bandaliyev</text>
<text x="64" y="292" class="sans" font-size="20" fill="#9DA7B3">CS student @ ELTE  ·  embedded systems  ·  automation</text>
<!-- chips -->
<g transform="translate(64 318)">
<rect width="214" height="34" rx="17" fill="#132A1F" stroke="#2EA04366"/>
<circle cx="22" cy="17" r="5" fill="#3FB950"/>
<circle cx="22" cy="17" r="5" fill="#3FB950" class="pulse"/>
<text x="38" y="22" class="mono" font-size="14" fill="#7EE2A0">open to internships</text>
</g>
<g transform="translate(290 318)">
<rect width="168" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
<text x="18" y="22" class="mono" font-size="14" fill="#9DA7B3">⌖ Budapest, HU</text>
</g>
<g transform="translate(470 318)">
<rect width="190" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
<text x="18" y="22" class="mono" font-size="14" fill="#9DA7B3">AZ · RU · EN · TR</text>
</g>
<!-- right: live "viewfinder" -->
<rect x="760" y="70" width="372" height="236" rx="18" fill="#0A0E14" stroke="#30363D" stroke-width="1.5"/>
<g clip-path="url(#view)">
<!-- floor perspective -->
<path d="M760 250 L1132 250" stroke="#21262D"/>
<path d="M946 178 L800 306 M946 178 L1092 306 M946 178 L946 306" stroke="#1B2129"/>
<!-- walking corridor -->
<path d="M900 306 L930 200 L962 200 L992 306 Z" fill="#71A9FF" opacity=".07"/>
<!-- obstacle: chair -->
<g fill="none" stroke="#6E7681" stroke-width="3" stroke-linecap="round">
<path d="M1032 156 v84 M1032 198 h42 v42"/>
</g>
<!-- obstacle: door/wall left -->
<rect x="806" y="128" width="54" height="104" rx="3" fill="#161B22" stroke="#30363D"/>
<circle cx="850" cy="182" r="3" fill="#6E7681"/>
<!-- detection boxes -->
<rect x="1014" y="146" width="76" height="102" rx="4" fill="none" stroke="#FF766B" stroke-width="2.2" class="box"/>
<g class="tag">
<rect x="1014" y="124" width="104" height="20" rx="4" fill="#FF766B"/>
<text x="1021" y="138" class="mono" font-size="12" fill="#0D1117" font-weight="700">chair · 1.2 m</text>
</g>
<rect x="798" y="120" width="70" height="120" rx="4" fill="none" stroke="#71A9FF" stroke-width="2" class="box" opacity=".85"/>
<!-- scanline -->
<g class="scan">
<rect x="760" y="76" width="372" height="2" fill="#B589FF" opacity=".8"/>
<rect x="760" y="60" width="372" height="18" fill="#B589FF" opacity=".06"/>
</g>
</g>
<!-- viewfinder corners -->
<g fill="none" stroke="#C3A0FF" stroke-width="2.5" stroke-linecap="round">
<path d="M776 98 v-14 h14 M1116 98 v-14 h-14 M776 278 v14 h14 M1116 278 v14 h-14"/>
</g>
<text x="798" y="294" class="mono" font-size="11" fill="#6E7681">REC ● yolo11n</text>
<!-- L / C / R risk -->
<g transform="translate(860 322)" class="mono" font-size="12">
<text x="-108" y="11" fill="#6E7681">risk</text>
<rect x="-60" y="0" width="44" height="14" rx="3" fill="#71A9FF" class="r1"/>
<rect x="-8" y="0" width="44" height="14" rx="3" fill="#B589FF" class="r2"/>
<rect x="44" y="0" width="44" height="14" rx="3" fill="#FF766B" class="r3"/>
<text x="-46" y="38" fill="#6E7681">L</text>
<text x="6" y="38" fill="#6E7681">C</text>
<text x="58" y="38" fill="#6E7681">R</text>
</g>
<text x="1132" y="333" class="mono" font-size="12" fill="#FF8F86" text-anchor="end">→ "obstacle right"</text>
</svg>
