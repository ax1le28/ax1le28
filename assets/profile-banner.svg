<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Javidan Bandaliyev — software, embedded systems, automation</title>
  <desc id="desc">A custom dark blue banner with a glowing vision sensor and connected nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.58" stop-color="#122d38"/>
      <stop offset="1" stop-color="#173d46"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51e0c0"/>
      <stop offset="1" stop-color="#4ea4ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b5e6ef" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M30 48V312" stroke="#f5a65b" stroke-width="4" stroke-linecap="round"/>
  <text x="68" y="88" fill="#70dfc6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">SOFTWARE · EMBEDDED · AUTOMATION</text>
  <text x="64" y="165" fill="#f4f7fb" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">Javidan Bandaliyev</text>
  <text x="68" y="211" fill="#c5d5e1" font-family="Inter, Arial, sans-serif" font-size="21">Building useful software from the screen to the real world.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="68" y="250" width="116" height="36" rx="18" fill="#203b49" stroke="#426575"/>
    <text x="126" y="273" fill="#eff7f7" text-anchor="middle">JAVA · C++</text>
    <rect x="196" y="250" width="128" height="36" rx="18" fill="#203b49" stroke="#426575"/>
    <text x="260" y="273" fill="#eff7f7" text-anchor="middle">ESP32 · PLC</text>
    <rect x="336" y="250" width="114" height="36" rx="18" fill="#203b49" stroke="#426575"/>
    <text x="393" y="273" fill="#eff7f7" text-anchor="middle">PYTHON · C#</text>
  </g>
  <g transform="translate(920 178)">
    <circle r="112" fill="#163b46" fill-opacity=".55" stroke="#4dd9c0" stroke-opacity=".28" stroke-width="1.5"/>
    <circle r="82" fill="none" stroke="url(#glow)" stroke-width="2" stroke-dasharray="5 9"/>
    <circle r="58" fill="#142a35" stroke="#70dfc6" stroke-width="3" filter="url(#softGlow)"/>
    <circle r="37" fill="#1d4351" stroke="#72d9d1" stroke-opacity=".65" stroke-width="2"/>
    <circle r="17" fill="#66e2c8" fill-opacity=".9"/>
    <circle r="7" fill="#e9fff8"/>
    <path d="M-120 0H-90M90 0h30M0-120v28M0 92v28" stroke="#f5a65b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-98" cy="-70" r="6" fill="#f5a65b"/>
    <circle cx="92" cy="68" r="5" fill="#77b8ff"/>
    <circle cx="68" cy="-96" r="4" fill="#70dfc6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.4" fill="#9fb8c4">
    <text x="1048" y="90">INPUT</text>
    <text x="1060" y="278">SIGNAL</text>
  </g>
  <path d="M1080 101l-22 32M1078 260l-21-31" stroke="#6a8d99" stroke-width="1.5" stroke-dasharray="3 5"/>
</svg>
