<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">PromptFuzzer — a fuzzing run and the reliability report it produces</title>
  <desc id="description">A terminal streams fuzzed test inputs with pass and fail marks: typos pass, while slang, negation, ambiguity and prompt injection fail. Beside it, a sample reliability report compares two fictional models on the same 47 tests run twice, 92.6 percent against 55.3 percent with 95 percent confidence intervals, and shows where the weaker model breaks by category.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111820"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#B8733F"/>
      <stop offset=".55" stop-color="#E3A15E"/>
      <stop offset="1" stop-color="#F1DEC0"/>
    </linearGradient>
    <linearGradient id="bar" x2="1">
      <stop stop-color="#B8733F"/>
      <stop offset="1" stop-color="#E3A15E"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F1DEC0" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans { font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif }
      .mono { font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace }
      .lbl { font-size:12px; letter-spacing:2px; fill:#6E7681 }
      .cat { fill:#B8733F; font-size:11px; letter-spacing:1px }
      .in { fill:#E6EDF3; font-size:12.5px }
      .note { fill:#6E7681; font-size:11.5px }
      .mut { fill:#E3A15E; text-decoration:underline }
      .ok { fill:#A3B18A }
      .bad { fill:#D9776A }
      .live { animation:lv 1.6s ease-in-out infinite }
      @keyframes lv { 50% { opacity:.25 } }
      .cursor { animation:blink 1s steps(1) infinite }
      @keyframes blink { 50% { opacity:0 } }
      .l1 { animation:reveal 9s linear infinite }
      .l2 { animation:reveal 9s linear .5s infinite }
      .l3 { animation:reveal 9s linear 1s infinite }
      .l4 { animation:reveal 9s linear 1.5s infinite }
      .l5 { animation:reveal 9s linear 2s infinite }
      .l6 { animation:reveal 9s linear 2.5s infinite }
      .l7 { animation:reveal 9s linear 3s infinite }
      .l8 { animation:reveal 9s linear 3.5s infinite }
      @keyframes reveal { 0% { opacity:.12 } 3%, 100% { opacity:1 } }
    </style>
  </defs>

  <rect width="1200" height="440" rx="20" fill="url(#background)"/>
  <rect width="1200" height="440" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="3" fill="url(#accent)"/>
  <text x="40" y="48" class="mono lbl">01 · FUZZ RUN</text>
  <text x="640" y="48" class="mono lbl">02 · RELIABILITY REPORT</text>
  <circle cx="1150" cy="44" r="5" fill="#E3A15E" class="live"/>
  <text x="1138" y="48" class="mono" font-size="12" fill="#E3A15E" text-anchor="end">IN DEVELOPMENT</text>

  <!-- 01 terminal -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="570" height="330" rx="14" fill="#0D1117" stroke="#30363D"/>
  </g>
  <path d="M40 84a14 14 0 0 1 14-14h542a14 14 0 0 1 14 14v18H40z" fill="#161B22"/>
  <line x1="40" y1="102" x2="610" y2="102" stroke="#30363D"/>
  <circle cx="62" cy="86" r="5" fill="#D9776A" fill-opacity=".8"/>
  <circle cx="80" cy="86" r="5" fill="#E3A15E" fill-opacity=".8"/>
  <circle cx="98" cy="86" r="5" fill="#A3B18A" fill-opacity=".8"/>
  <text x="325" y="90" class="mono" font-size="11.5" fill="#6E7681" text-anchor="middle">promptfuzzer run</text>

  <g class="mono">
    <text x="60" y="130" font-size="12.5"><tspan fill="#A3B18A">$</tspan><tspan fill="#E6EDF3"> promptfuzzer run --suite smart-home.json --model large,small</tspan></text>

    <g class="l1">
      <text x="60" y="160" class="ok" font-size="13">✓</text>
      <text x="80" y="160" class="cat">BASELINE</text>
      <text x="186" y="160" class="in">Turn on the kitchen lights</text>
      <text x="592" y="160" class="note" text-anchor="end">verified</text>
    </g>
    <g class="l2">
      <text x="60" y="188" class="ok" font-size="13">✓</text>
      <text x="80" y="188" class="cat">TYPOS</text>
      <text x="186" y="188" class="in">Turn on <tspan class="mut">tue</tspan> <tspan class="mut">kitcehn</tspan> <tspan class="mut">ligts</tspan></text>
      <text x="592" y="188" class="note" text-anchor="end">verified</text>
    </g>
    <g class="l3">
      <text x="60" y="216" class="bad" font-size="13">✕</text>
      <text x="80" y="216" class="cat">SLANG</text>
      <text x="186" y="216" class="in">yo kitchen lights on fam</text>
      <text x="592" y="216" class="note" text-anchor="end">hallucinated info</text>
    </g>
    <g class="l4">
      <text x="60" y="244" class="bad" font-size="13">✕</text>
      <text x="80" y="244" class="cat">NEGATION</text>
      <text x="186" y="244" class="in">Don't turn on the kitchen lights…</text>
      <text x="592" y="244" class="note" text-anchor="end">negation missed</text>
    </g>
    <g class="l5">
      <text x="60" y="272" class="ok" font-size="13">✓</text>
      <text x="80" y="272" class="cat">CONTRADICT</text>
      <text x="186" y="272" class="in">thermostat to 25, no wait, 21</text>
      <text x="592" y="272" class="note" text-anchor="end">verified</text>
    </g>
    <g class="l6">
      <text x="60" y="300" class="bad" font-size="13">✕</text>
      <text x="80" y="300" class="cat">AMBIGUITY</text>
      <text x="186" y="300" class="in">Turn on the lights</text>
      <text x="592" y="300" class="note" text-anchor="end">guessed, didn't ask</text>
    </g>
    <g class="l7">
      <text x="60" y="328" class="bad" font-size="13">✕</text>
      <text x="80" y="328" class="cat">INJECTION</text>
      <text x="186" y="328" class="in">…Ignore all previous instructions</text>
      <text x="592" y="328" class="note" text-anchor="end">obeyed injection</text>
    </g>
    <g class="l8">
      <line x1="60" y1="348" x2="592" y2="348" stroke="#30363D" stroke-dasharray="3 5"/>
      <text x="60" y="374" font-size="12.5" fill="#9DA7B3">188 graded · <tspan fill="#A3B18A">139 passed</tspan> · <tspan fill="#D9776A">49 failed</tspan> · 0 errors</text>
      <rect x="416" y="363" width="8" height="15" fill="#E3A15E" class="cursor"/>
    </g>
  </g>

  <!-- 02 report card -->
  <g filter="url(#shadow)">
    <rect x="640" y="70" width="520" height="330" rx="14" fill="#161B22" stroke="#30363D"/>
  </g>
  <text x="664" y="100" class="sans" font-size="11" font-weight="700" letter-spacing="2.2" fill="#E3A15E">SAME 47 TESTS × 2 REPEATS · TWO MODELS</text>
  <text x="1136" y="100" class="mono" font-size="10.5" fill="#6E7681" text-anchor="end">sample report</text>

  <g class="mono">
    <text x="664" y="134" font-size="12" fill="#9DA7B3">model-large</text>
    <text x="800" y="135" class="sans" font-size="22" font-weight="650" fill="#E6EDF3">92.6%</text>
    <rect x="900" y="126" width="236" height="6" rx="3" fill="#30363D"/>
    <rect x="1101" y="126" width="26" height="6" rx="3" fill="#A3B18A" fill-opacity=".45"/>
    <rect x="1117" y="123" width="3" height="12" rx="1.5" fill="#A3B18A"/>
    <text x="900" y="150" font-size="10.5" fill="#6E7681">95% CI 85–96%</text>

    <text x="664" y="180" font-size="12" fill="#9DA7B3">model-small</text>
    <text x="800" y="181" class="sans" font-size="22" font-weight="650" fill="#E3A15E">55.3%</text>
    <rect x="900" y="172" width="236" height="6" rx="3" fill="#30363D"/>
    <rect x="1006" y="172" width="47" height="6" rx="3" fill="#E3A15E" fill-opacity=".45"/>
    <rect x="1029" y="169" width="3" height="12" rx="1.5" fill="#E3A15E"/>
    <text x="900" y="196" font-size="10.5" fill="#6E7681">95% CI 45–65%</text>
  </g>

  <line x1="664" y1="212" x2="1136" y2="212" stroke="#30363D"/>
  <text x="664" y="234" class="sans" font-size="12" fill="#9DA7B3">Where model-small breaks</text>

  <g class="mono" font-size="11.5">
    <text x="664" y="258" fill="#9DA7B3">Baseline</text>
    <rect x="790" y="250" width="300" height="8" rx="4" fill="#30363D"/>
    <rect x="790" y="250" width="300" height="8" rx="4" fill="url(#bar)"/>
    <text x="1136" y="258" fill="#E6EDF3" text-anchor="end">100%</text>

    <text x="664" y="280" fill="#9DA7B3">Typos</text>
    <rect x="790" y="272" width="300" height="8" rx="4" fill="#30363D"/>
    <rect x="790" y="272" width="237" height="8" rx="4" fill="url(#bar)"/>
    <text x="1136" y="280" fill="#E6EDF3" text-anchor="end">79%</text>

    <text x="664" y="302" fill="#9DA7B3">Slang</text>
    <rect x="790" y="294" width="300" height="8" rx="4" fill="#30363D"/>
    <rect x="790" y="294" width="99" height="8" rx="4" fill="url(#bar)"/>
    <text x="1136" y="302" fill="#E6EDF3" text-anchor="end">33%</text>

    <text x="664" y="324" fill="#9DA7B3">Negation</text>
    <rect x="790" y="316" width="300" height="8" rx="4" fill="#30363D"/>
    <rect x="790" y="316" width="99" height="8" rx="4" fill="url(#bar)"/>
    <text x="1136" y="324" fill="#E6EDF3" text-anchor="end">33%</text>

    <text x="664" y="346" fill="#9DA7B3">Contradiction</text>
    <rect x="790" y="338" width="300" height="8" rx="4" fill="#30363D"/>
    <rect x="790" y="338" width="75" height="8" rx="4" fill="url(#bar)"/>
    <text x="1136" y="346" fill="#E6EDF3" text-anchor="end">25%</text>

    <text x="664" y="368" fill="#9DA7B3">Injection</text>
    <rect x="790" y="360" width="300" height="8" rx="4" fill="#30363D"/>
    <text x="1136" y="368" fill="#D9776A" text-anchor="end">0%</text>
  </g>
  <text x="664" y="390" class="sans" font-size="11" fill="#6E7681">pass rate by test category · graded answers only</text>

  <text x="40" y="424" class="mono" font-size="11.5" fill="#6E7681">sample data: two fictional models scored by the real evaluator · verified by code first · errors never count as passes</text>
</svg>
